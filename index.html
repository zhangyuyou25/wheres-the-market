  .search-box input:focus{border-color:#999}
  .search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#bbb}
  
  /* Filter labels */
  .filter-section{margin-bottom:20px}
  .filter-label{font-size:.75rem;color:#999;margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border:1px solid #e8e8e8;border-radius:20px;font-size:.8rem;color:#666;cursor:pointer;user-select:none;transition:all .15s;background:#fff}
  .tag:hover{border-color:#ccc;background:#fafafa}
  .tag.active{background:#333;color:#fff;border-color:#333}
  .tag .count{font-size:.7rem;opacity:.6}
  
  /* Results */
  .results-summary{font-size:.8rem;color:#999;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #f0f0f0}
  .results-summary span{color:#333;font-weight:600}

  .city-group h3 .store-count{font-size:.75rem;color:#bbb;font-weight:400}
  
  .district-group{margin-bottom:16px;padding-left:4px}
  .district-group h4{font-size:.85rem;color:#888;font-weight:600;margin-bottom:6px;padding-left:8px;border-left:2px solid #e8e8e8}
  
  .store-card{display:flex;align-items:flex-start;gap:8px;padding:6px 0 6px 16px;position:relative}
  .store-card::before{content:'';position:absolute;left:5px;top:14px;width:4px;height:4px;border-radius:50%;background:#ccc}
  .store-card .brand-badge{font-size:.7rem;padding:1px 6px;border-radius:4px;white-space:nowrap;font-weight:500}
  .brand-badge.sams{background:#e8f0fe;color:#1a73e8}
  .brand-badge.costco{background:#fce8e6;color:#d93025}
  .brand-badge.aldi{background:#fef7e0;color:#e37400}
  .store-card .store-info{flex:1;min-width:0}
  .store-card .store-name{font-size:.85rem;font-weight:500;margin-bottom:1px}
  .store-card .store-address{font-size:.8rem;color:#999;word-break:break-all}
  .store-card .store-hours{font-size:.7rem;color:#ccc;margin-top:2px}
  
  /* Empty state */
  .empty{text-align:center;padding:40px 20px;color:#ccc}
  .empty p{font-size:.9rem}
  
  /* Clear button */
  .clear-btn{font-size:.75rem;color:#999;cursor:pointer;border:none;background:none;text-decoration:underline;margin-left:8px}
  .clear-btn:hover{color:#333}
  
  /* Footer */
  .footer{text-align:center;margin-top:40px;padding-top:20px;border-top:1px solid #f0f0f0;font-size:.75rem;color:#ccc}
  .footer a{color:#999;text-decoration:none}
  .footer a:hover{color:#666}
  
  /* Brand colors for badge */
  .brand-badge.aldi{background:#fef7e0;color:#e37400}
</style>

// 品牌信息
const BRANDS = [
  { key: '山姆', class: 'sams' },
  { key: '开市客', class: 'costco' },
  { key: '奥乐齐', class: 'aldi' }
];

// 状态
let activeBrands = new Set();
let activeCities = new Set();
let searchQuery = '';

// 初始化
const searchInput = document.getElementById('searchInput');
const brandTagsEl = document.getElementById('brandTags');
const cityTagsEl = document.getElementById('cityTags');
const summaryEl = document.getElementById('summary');
const resultsEl = document.getElementById('results');
const clearBtn = document.getElementById('clearBtn');

// 构建城市列表
const cityList = [...new Set(STORES.map(s => s.city))].sort();

// 渲染品牌标签
BRANDS.forEach(b => {
  const count = STORES.filter(s => s.brand === b.key).length;
  const el = document.createElement('span');
  el.className = 'tag';
  el.dataset.brand = b.key;
  el.innerHTML = `${b.key} <span class="count">${count}</span>`;
  el.addEventListener('click', () => toggleBrand(b.key, el));
  brandTagsEl.appendChild(el);
});

// 渲染城市标签
cityList.forEach(c => {
  const count = STORES.filter(s => s.city === c).length;
  const el = document.createElement('span');
  el.className = 'tag';
  el.dataset.city = c;
  el.innerHTML = `${c} <span class="count">${count}</span>`;
  el.addEventListener('click', () => toggleCity(c, el));
  cityTagsEl.appendChild(el);
});

// 搜索框
searchInput.addEventListener('input', (e) => {
  searchQuery = e.target.value.trim().toLowerCase();
  render();
});

// 清除按钮
clearBtn.addEventListener('click', () => {
  activeBrands.clear();
  activeCities.clear();
  searchQuery = '';
  searchInput.value = '';
  document.querySelectorAll('.tag.active').forEach(el => el.classList.remove('active'));
  render();
});

function toggleBrand(brand, el) {
  if (activeBrands.has(brand)) {
    activeBrands.delete(brand);
    el.classList.remove('active');
  } else {
    activeBrands.add(brand);
    el.classList.add('active');
  }
  render();
}

function toggleCity(city, el) {
  if (activeCities.has(city)) {
    activeCities.delete(city);
    el.classList.remove('active');
  } else {
    activeCities.add(city);
    el.classList.add('active');
  }
  render();
}

function getFilteredStores() {
  return STORES.filter(s => {
    // 品牌筛选
    if (activeBrands.size > 0 && !activeBrands.has(s.brand)) return false;
    // 城市筛选
    if (activeCities.size > 0 && !activeCities.has(s.city)) return false;
    // 搜索
    if (searchQuery) {
      const q = searchQuery;
      const text = `${s.brand} ${s.name} ${s.city} ${s.district} ${s.address}`.toLowerCase();
      if (!text.includes(q)) return false;
    }
    return true;
  });
}

function render() {
  const filtered = getFilteredStores();
  
  // 显示/隐藏清除按钮
  clearBtn.style.display = (activeBrands.size > 0 || activeCities.size > 0 || searchQuery) ? 'inline' : 'none';
  
  // 摘要
  if (filtered.length === 0) {
    summaryEl.innerHTML = '';
    resultsEl.innerHTML = '<div class="empty"><p>没有匹配的门店，试试调整筛选条件</p></div>';
    return;
  }
  
  const cities = [...new Set(filtered.map(s => s.city))];
  const brands = [...new Set(filtered.map(s => s.brand))];
  summaryEl.innerHTML = `共 <span>${filtered.length}</span> 家门店 · <span>${cities.length}</span> 个城市 · <span>${brands.length}</span> 个品牌`;
  
  // 按城市 → 区分组
  const cityMap = {};
  filtered.forEach(s => {
    if (!cityMap[s.city]) cityMap[s.city] = {};
    if (!cityMap[s.city][s.district]) cityMap[s.city][s.district] = [];
    cityMap[s.city][s.district].push(s);
  });
  
  let html = '';
  Object.keys(cityMap).sort().forEach(city => {
    const cityCount = Object.values(cityMap[city]).reduce((sum, arr) => sum + arr.length, 0);
    html += `<div class="city-group"><h3>${city} <span class="store-count">${cityCount} 家</span></h3>`;
    
    Object.keys(cityMap[city]).sort().forEach(district => {
      const stores = cityMap[city][district];
      html += `<div class="district-group"><h4>${district}</h4>`;
      stores.forEach(s => {
        const brandClass = BRANDS.find(b => b.key === s.brand)?.class || '';
        const hoursHtml = s.hours ? `<div class="store-hours">营业时间：${s.hours}</div>` : '';
        html += `<div class="store-card">
          <span class="brand-badge ${brandClass}">${s.brand}</span>
          <div class="store-info">
            <div class="store-name">${s.name}</div>
            <div class="store-address">${s.address}</div>
            ${hoursHtml}
          </div>
        </div>`;
      });
      html += `</div>`;
    });
    
    html += `</div>`;
  });
  
  resultsEl.innerHTML = html;
}

// 初始渲染
render();
